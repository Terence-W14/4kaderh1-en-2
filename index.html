AVATAR_GROUPS["🧱 Blokgame-figuren"]=["a096", "a097", "a098", "a099", "a100", "a101", "a102", "a103"];
const avatarHTML=(a)=>/^a\d{3}$/.test(a)&&AVATAR_IMAGES[a]?'<img class="avatar-img" src="'+AVATAR_IMAGES[a]+'" alt="" loading="lazy">':escapeHtml(a||'🐾');
const animalContainer=document.getElementById('animalChoices');
animalContainer.style.display='block';
for(const [category,avatars] of Object.entries(AVATAR_GROUPS)){
 const heading=document.createElement('h3');heading.textContent=category;heading.style.margin='16px 0 8px';animalContainer.appendChild(heading);
 const grid=document.createElement('div');grid.className='animal-grid';
 for(const avatar of avatars){
  const btn=document.createElement('button');btn.type='button';btn.className='animal-choice'+(avatar===chosenAnimal?' selected':'');
  btn.innerHTML=avatarHTML(avatar);btn.style.minHeight='72px';btn.style.padding='4px';
  btn.setAttribute('aria-label','Kies '+avatar);btn.setAttribute('aria-pressed',String(avatar===chosenAnimal));
  btn.onclick=()=>{chosenAnimal=avatar;for(const b of animalContainer.querySelectorAll('.animal-choice')){b.classList.toggle('selected',b===btn);b.setAttribute('aria-pressed',String(b===btn))}};
  grid.appendChild(btn);
 }
 animalContainer.appendChild(grid);
}
let knownHackIds=new Set(),hackNotificationInitialized=false;
let role='',pin='',token='',state=null,position=0,cycle=1,order=shuffle(QUESTIONS.map((_,i)=>i)),current=null,locked=false,freezeUntil=0,stage='waiting',poll=null,interval=null;
for(let i=1;i<=15;i++)$('duration').add(new Option(i+' '+(i===1?'minuut':'minuten'),i,i===10,i===10));
$('teacherBtn').onclick=()=>{$('teacherForm').classList.remove('hide');$('studentForm').classList.add('hide')};$('studentBtn').onclick=()=>{$('studentForm').classList.remove('hide');$('teacherForm').classList.add('hide')};
function show(x){for(let id of ['home','teacher','player'])$(id).classList.toggle('hide',id!==x)}
async function api(route,data){let r=await fetch('/api/'+route,{method:data?'POST':'GET',headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||'Er ging iets mis');return j}
function error(e){alert(e.message||String(e))}
$('createBtn').onclick=async()=>{try{let r=await api('create',{duration:Number($('duration').value)});role='teacher';pin=r.pin;token=r.token;$('gamecode').textContent=pin;$('joinLink').textContent='Leerlingen openen: '+location.origin;show('teacher');startPolling();refresh()}catch(e){error(e)}};
$('joinBtn').onclick=async()=>{try{let name=$('name').value.trim();let r=await api('join',{pin:$('pin').value.trim(),name,animal:chosenAnimal});role='player';pin=r.pin;token=r.token;$('greeting').innerHTML='Hoi '+avatarHTML(r.animal)+' '+escapeHtml(name)+'!';$('myCodes').innerHTML='<p class="muted">Jouw 3 geheime codes (houd ze voor jezelf):</p>'+r.codes.map(c=>'<span class="tag code">'+c+'</span>').join('');show('player');startPolling();refresh();refresh()}catch(e){$('notice').textContent=e.message}};
$('startBtn').onclick=async()=>{try{await api('start',{pin,token});refresh()}catch(e){error(e)}};
$('endBtn').onclick=async()=>{if(!confirm('Spel stoppen?'))return;try{await api('end',{pin,token});refresh()}catch(e){error(e)}};
function remaining(){if(!state||state.phase==='lobby')return '--:--';let s=Math.max(0,Math.ceil((state.endsAt-Date.now())/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function board(list){return list.length?list.map((p,i)=>'<div class="leader"><span>'+(i+1)+'. '+avatarHTML(p.animal)+' '+escapeHtml(p.name)+'</span><span class="gold">₿ '+p.coins+' <small class="muted">('+p.completed+' vragen)</small></span></div>').join(''):'<p class="muted">Nog geen leerlingen</p>'}
async function refresh(){if(!role)return;try{state=await api('state?pin='+encodeURIComponent(pin)+'&token='+encodeURIComponent(token));if(state.phase==='running'&&Date.now()>=state.endsAt)state.phase='finished';if(role==='teacher'){$('teacherTime').textContent=remaining();$('startBtn').disabled=state.phase!=='lobby';$('teacherStatus').textContent=state.phase==='lobby'?'Wachten op leerlingen.':state.phase==='running'?'Leerlingen spelen op eigen tempo.':'Spel afgelopen.';$('teacherBoard').innerHTML=board(state.players)}else{$('playerTime').textContent=remaining();$('coins').textContent=state.me.coins;$('stats').textContent=state.me.completed+' vragen beantwoord';$('playerBoard').innerHTML=board(state.players);checkHackNotifications(state.me.hackEvents);if(state.phase==='lobby'){$('playArea').innerHTML='<h3>Wachten op de docent…</h3>'}else if(state.phase==='finished'){stage='finished';current=null;$('playArea').innerHTML='<h2>De tijd is voorbij!</h2><p>Je eindscore: ₿ '+state.me.coins+'</p>'}else if(stage==='freeze'){if(state.me.frozenUntil)freezeUntil=state.me.frozenUntil;renderFreeze()}else if(stage==='waiting'){nextQuestion()}}}catch(e){console.warn(e.message)}}
function showHackNotification(event){
 const toast=document.createElement('div');
 toast.setAttribute('role','alert');
 toast.style.cssText='position:fixed;z-index:99999;top:18px;left:50%;transform:translateX(-50%);width:min(92vw,440px);padding:22px;border-radius:18px;background:#591127;color:#fff;border:3px solid #ff5279;box-shadow:0 10px 45px #0009;text-align:center;font-size:19px;font-weight:700';
 const heading=document.createElement('div');heading.style.cssText='font-size:27px;margin-bottom:9px';heading.textContent='🚨 JE BENT GEHACKT! 🚨';toast.appendChild(heading);
 const body=document.createElement('div');body.textContent=event.attacker+' heeft ₿ '+event.amount.toLocaleString('nl-NL')+' van je gestolen!'+(event.all?' 😱 AL JE CRYPTO!':'');toast.appendChild(body);
 const close=document.createElement('button');close.textContent='OK, verder spelen';close.style.cssText='margin-top:15px;padding:10px 20px;border-radius:12px;background:#fff;color:#591127;border:0;font-weight:800;cursor:pointer';close.onclick=()=>toast.remove();toast.appendChild(close);
 document.body.appendChild(toast);setTimeout(()=>toast.remove(),15000);
}
function checkHackNotifications(events){
 if(!Array.isArray(events))return;
 if(!hackNotificationInitialized){hackNotificationInitialized=true;}
 for(const e of events){if(!knownHackIds.has(e.id)){knownHackIds.add(e.id);showHackNotification(e)}}
}
function startPolling(){if(poll)clearInterval(poll);if(interval)clearInterval(interval);poll=setInterval(refresh,2500);interval=setInterval(()=>{if(!state)return;let t=remaining();$('teacherTime').textContent=t;$('playerTime').textContent=t;if(state.phase==='running'&&Date.now()>=state.endsAt){state.phase='finished';refresh()}else if(stage==='freeze')renderFreeze()},250)}
function nextQuestion(){if(!state||state.phase!=='running'||Date.now()<freezeUntil)return;if(position>=QUESTIONS.length){position=0;cycle++;order=shuffle(QUESTIONS.map((_,i)=>i))}let q=QUESTIONS[order[position]];current=q;locked=false;stage='question';$('progress').style.width=(position/QUESTIONS.length*100)+'%';$('playArea').innerHTML='<p class="gold">RONDE '+cycle+' · VRAAG '+(position+1)+' / '+QUESTIONS.length+'</p><h2>'+escapeHtml(q.q)+'</h2><div class="grid" id="answers"></div><div id="feedback"></div>';for(let i of shuffle([0,1,2,3])){let b=document.createElement('button');b.className='option';b.textContent=q.options[i];b.onclick=()=>answer(i);$('answers').appendChild(b)}}
function renderFreeze(){if(stage!=='freeze')return;if(!state||state.phase!=='running'||Date.now()>=state.endsAt){refresh();return}let left=Math.max(0,Math.ceil((freezeUntil-Date.now())/1000));if(left<=0){stage='waiting';position++;current=null;nextQuestion();return}$('playArea').innerHTML='<h2 class="bad">❄️ Fout antwoord!</h2><p>Je kunt 7 seconden niets doen. Geen cadeautje deze beurt.</p><div class="big">Nog '+left+' seconden</div><p class="muted">Juiste antwoord: '+escapeHtml(current.options[current.correct])+'</p>'}
async function answer(choice){if(locked||stage!=='question'||!state||state.phase!=='running'||Date.now()>=state.endsAt)return;locked=true;try{let r=await api('answer',{pin,token,question:order[position],cycle,choice});if(!r.ok){stage='freeze';freezeUntil=r.frozenUntil;renderFreeze();refresh();return}stage='box';$('playArea').innerHTML='<h2 class="good">Goed! +500 crypto</h2><h3>Kies één vakje</h3><div class="grid" id="boxes"></div>';for(let i=0;i<4;i++){let b=document.createElement('button');b.className='boxpick';b.textContent='🎁';b.setAttribute('aria-label','Vakje '+(i+1));b.onclick=()=>pickBox(i);$('boxes').appendChild(b)}refresh()}catch(e){locked=false;error(e)}}
async function pickBox(i){if(stage!=='box')return;stage='loading';try{let r=await api('box',{pin,token,box:i});if(r.type==='hack'&&!r.noTarget){stage='hack';$('playArea').innerHTML='<h2>🔓 Hack!</h2><p>Je willekeurige doelwit is <strong>'+escapeHtml(r.target)+'</strong>.</p><p>Kies de juiste geheime code:</p><div class="grid" id="guesses"></div>';for(let code of r.choices){let b=document.createElement('button');b.className='option';b.textContent=code;b.onclick=()=>guess(code);$('guesses').appendChild(b)}}else{let label=r.type==='hack'?'Geen andere speler om te hacken':r.type==='bonus'?'+1000 crypto':r.type==='double'?'Je crypto is verdubbeld! +'+r.gained:'Je crypto is verdrievoudigd! +'+r.gained;finishReward(label)}refresh()}catch(e){stage='box';error(e)}}
async function guess(c){if(stage!=='hack')return;stage='loading';try{let r=await api('guess',{pin,token,guess:c});finishReward(r.success?'Hack gelukt! ₿ '+r.stolen+' gestolen.':'Hack mislukt!');refresh()}catch(e){stage='hack';error(e)}}
function finishReward(label){stage='reward';$('playArea').innerHTML='<h2 class="gold">'+escapeHtml(label)+'</h2><button id="nextBtn">Volgende vraag →</button>';$('nextBtn').onclick=()=>{position++;current=null;stage='waiting';nextQuestion()}}
</script></body></html>
